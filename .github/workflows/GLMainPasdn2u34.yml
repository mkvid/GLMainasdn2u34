name: GLMainPasdn2u34

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

jobs:
  GLMainPasdn2u34:
    runs-on: ubuntu-latest
    environment: GLMainPasdn2u34
    permissions:
      contents: write
    env:
      B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
      B2_APPLICATION_KEY_ID: ${{ secrets.B2_APPLICATION_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      WORKER_BASE_URL: ${{ secrets.WORKER_BASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      ABANDONED_PROCESS_DAYS_TO_CANCEL: ${{ vars.ABANDONED_PROCESS_DAYS_TO_CANCEL }}
      ABANDONED_QUEUE_DAYS_TO_CANCEL: ${{ vars.ABANDONED_QUEUE_DAYS_TO_CANCEL }}
      ACTIVE_ACCOUNT_ERROR_COUNT: ${{ vars.ACTIVE_ACCOUNT_ERROR_COUNT }}
      COOKIE_COUNT_TO_FAIL: ${{ vars.COOKIE_COUNT_TO_FAIL }}
      NON_PRIO_ACCOUNT_RESET_DAYS: ${{ vars.NON_PRIO_ACCOUNT_RESET_DAYS }}
      PRIO_ACCOUNT_RESET_DAYS: ${{ vars.PRIO_ACCOUNT_RESET_DAYS }}
      QUEUE_COUNT_TO_FAIL: ${{ vars.QUEUE_COUNT_TO_FAIL }}
      IG_COOLDOWN: ${{ vars.IG_COOLDOWN }}
      OTHER_COOLDOWN: ${{ vars.OTHER_COOLDOWN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.PRIVATE_REPO_PATH }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: ${{ secrets.PRIVATE_REPO_BRANCH }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
      - name: Prepare Configuration
        run: |
          python cli.py prepare_config
      - name: Process
        timeout-minutes: 300
        continue-on-error: true
        run: |
          python cli.py process_accounts
